<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="To-Do List Life Dashboard - A modern, unified interface for daily productivity, tasks, and focus management">
    <title>To-Do List Life Dashboard — Productivity &amp; Focus</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2.1">
</head>
<body>
    <div class="container">
        <!-- Greeting Section -->
        <section class="greeting-section" aria-label="Greeting and current time display">
            <h1 class="greeting-message"></h1>
            <div class="date-time">
                <p class="time"></p>
                <p class="date"></p>
            </div>
            <button id="settings-toggle" class="settings-btn" aria-label="Settings" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </section>

        <!-- Timer Section -->
        <section class="timer-section" aria-label="Pomodoro timer with controls">
            <h2>Focus Timer</h2>
            <div class="timer-display">
                <span class="timer-text" aria-label="Timer display in minutes and seconds format">25:00</span>
            </div>
            <div class="timer-controls">
                <button id="timer-start" class="btn btn-primary" aria-label="Start or resume the timer">Start</button>
                <button id="timer-stop" class="btn btn-secondary" aria-label="Pause or resume the timer">Stop</button>
                <button id="timer-reset" class="btn btn-secondary" aria-label="Reset the timer to 25 minutes">Reset</button>
            </div>
        </section>

        <!-- Task List Section -->
        <section class="task-section" aria-label="Task list management">
            <h2>To-Do List</h2>
            <div class="task-input-group">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="Add a new task..."
                    class="task-input"
                    aria-label="Task input field for adding new tasks"
                >
                <button id="task-add" class="btn btn-primary" aria-label="Add a new task to the list">Add</button>
            </div>
            <div class="sort-controls">
                <label for="sort-select">Sort by:</label>
                <select id="sort-select" class="sort-select" aria-label="Sort tasks">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="completion">Completion Status</option>
                </select>
            </div>
            <ul id="task-list" class="task-list" aria-label="List of tasks"></ul>
        </section>

        <!-- Quick Links Section -->
        <section class="quick-links-section" aria-label="Quick links management">
            <h2>Quick Links</h2>
            <div class="link-input-group">
                <input 
                    type="text" 
                    id="link-name" 
                    placeholder="Link name..."
                    class="link-input"
                    aria-label="Quick link name"
                >
                <input 
                    type="url"
                    id="link-url" 
                    placeholder="https://example.com"
                    class="link-input"
                    aria-label="Quick link URL"
                >
                <button id="link-add" class="btn btn-primary" aria-label="Add a new quick link">Add Link</button>
            </div>
            <div id="links-container" class="links-container" aria-label="Container for quick link buttons"></div>
        </section>
    </div>

    <!-- Settings Panel Modal -->
    <div id="settings-panel" class="settings-panel"
         role="dialog"
         aria-modal="true"
         aria-labelledby="settings-title"
         hidden>

        <!-- Overlay is separate from the modal -->
        <div class="settings-overlay" data-settings-close></div>

        <!-- Actual settings window -->
        <div class="settings-modal">
            <div class="settings-header">
                <h2 id="settings-title">Settings</h2>
                <button type="button"
                        class="settings-close"
                        data-settings-close
                        aria-label="Close settings">
                    &times;
                </button>
            </div>

            <!-- Scrollable body -->
            <div class="settings-body">

                <!-- Name Section -->
                <section
                    class="settings-section"
                    data-section="name"
                    aria-label="Name settings"
                >
                    <h3>Name</h3>

                    <div class="settings-control" data-setting="name">
                        <label for="user-name-input">Your Name</label>

                        <p
                            id="user-name-description"
                            class="settings-description"
                        >
                            This name will be displayed in the greeting section.
                        </p>

                        <input
                            type="text"
                            id="user-name-input"
                            class="settings-input"
                            placeholder="Enter your name..."
                            aria-describedby="user-name-description"
                            maxlength="50"
                        >

                        <span class="char-count">
                            <span id="char-count-current">0</span>/50
                        </span>
                    </div>
                </section>

                <!-- Theme Section -->
                <section
                    class="settings-section"
                    data-section="theme"
                    aria-label="Theme settings"
                >
                    <h3>Theme</h3>

                    <p class="settings-description">
                        Choose your preferred theme for the dashboard
                    </p>

                    <div
                        class="settings-control theme-controls"
                        role="group"
                        aria-label="Theme selection"
                    >
                        <button
                            type="button"
                            class="theme-btn theme-light"
                            data-theme="light"
                            aria-pressed="false"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 6px;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                            Light
                        </button>

                        <button
                            type="button"
                            class="theme-btn theme-dark"
                            data-theme="dark"
                            aria-pressed="false"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 6px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                            Dark
                        </button>
                    </div>
                </section>

                <!-- Timer Duration Section -->
                <section
                    class="settings-section"
                    data-section="timer"
                    aria-label="Timer duration settings"
                >
                    <h3>Timer Duration</h3>

                    <p class="settings-description">
                        Select a preset duration or enter a custom time in minutes.
                    </p>

                    <div
                        class="settings-control timer-presets"
                        role="group"
                        aria-label="Timer preset buttons"
                    >
                        <button
                            type="button"
                            class="timer-preset-btn"
                            data-preset="15"
                        >
                            15 min
                        </button>

                        <button
                            type="button"
                            class="timer-preset-btn active"
                            data-preset="default"
                        >
                            25 min
                        </button>

                        <button
                            type="button"
                            class="timer-preset-btn"
                            data-preset="45"
                        >
                            45 min
                        </button>
                    </div>

                    <div class="settings-control">
                        <label for="custom-timer">
                            Custom Duration (minutes)
                        </label>

                        <input
                            type="number"
                            id="custom-timer"
                            class="settings-input"
                            min="1"
                            max="120"
                            step="1"
                            placeholder="1-120"
                        >

                        <div
                            id="timer-validation-message"
                            class="validation-message"
                            aria-live="polite"
                        ></div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
